groups:
- neurodata_type_def: FiberPhotometryViruses
  neurodata_type_inc: NWBContainer
  name: fiber_photometry_viruses
  doc: Group containing one or more ViralVector objects, to be used within a
    FiberPhotometry object.
  groups:
  - neurodata_type_inc: ViralVector
    doc: ViralVector object(s).
    quantity: +
- neurodata_type_def: FiberPhotometryVirusInjections
  neurodata_type_inc: NWBContainer
  name: fiber_photometry_virus_injections
  doc: Group containing one or more ViralVectorInjection objects, to be used
    within a FiberPhotometry object.
  groups:
  - neurodata_type_inc: ViralVectorInjection
    doc: ViralVectorInjection object(s).
    quantity: +
- neurodata_type_def: FiberPhotometryIndicators
  neurodata_type_inc: NWBContainer
  name: fiber_photometry_indicators
  doc: Group containing one or more Indicator objects, to be used within a
    FiberPhotometry object.
  groups:
  - neurodata_type_inc: Indicator
    doc: Indicator object(s).
    quantity: +
- neurodata_type_def: FiberPhotometryTable
  neurodata_type_inc: DynamicTable
  doc: Extends DynamicTable to hold metadata on the Fiber Photometry system.
  datasets:
  - name: location
    neurodata_type_inc: VectorData
    dtype: text
    dims:
    - num_rows
    shape:
    - null
    doc: Location of fiber.
  - name: coordinates
    neurodata_type_inc: VectorData
    dtype: float
    dims:
    - num_rows
    - x,y,z
    shape:
    - null
    - 3
    doc: Relative coordinates of fiber in multi-fiber array. If single fiber,
      use None.
    quantity: '?'
    attributes:
    - name: unit
      dtype: text
      value: millimeters
      doc: coordinates unit
  - name: excitation_wavelength_in_nm
    neurodata_type_inc: VectorData
    dtype: float
    dims:
    - num_rows
    shape:
    - null
    doc: Wavelength of excitation light in nanometers. NaN only for a row
      recorded with no excitation, such as a dark measurement with the
      excitation source off.
  - name: emission_wavelength_in_nm
    neurodata_type_inc: VectorData
    dtype: float
    dims:
    - num_rows
    shape:
    - null
    doc: Wavelength of emission light in nanometers.
  - name: indicator
    neurodata_type_inc: VectorData
    dtype:
      target_type: Indicator
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the indicator object.
  - name: notes
    neurodata_type_inc: VectorData
    dtype: text
    dims:
    - num_rows
    shape:
    - null
    doc: Free-text notes about this row.
    quantity: '?'
  - name: optical_fiber
    neurodata_type_inc: VectorData
    dtype:
      target_type: OpticalFiber
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the optical fiber device.
  - name: excitation_source
    neurodata_type_inc: VectorData
    dtype:
      target_type: ExcitationSource
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the excitation source device.
  - name: commanded_voltage_series
    neurodata_type_inc: VectorData
    dtype:
      target_type: CommandedVoltageSeries
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the commanded voltage series.
    quantity: '?'
  - name: photodetector
    neurodata_type_inc: VectorData
    dtype:
      target_type: Photodetector
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the photodetector device.
  - name: dichroic_mirror
    neurodata_type_inc: VectorData
    dtype:
      target_type: DichroicMirror
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the dichroic mirror device.
    quantity: '?'
  - name: emission_filter
    neurodata_type_inc: VectorData
    dtype:
      target_type: OpticalFilter
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the emission filter device.
    quantity: '?'
  - name: excitation_filter
    neurodata_type_inc: VectorData
    dtype:
      target_type: OpticalFilter
      reftype: object
    dims:
    - num_rows
    shape:
    - null
    doc: Link to the excitation filter device.
    quantity: '?'
- neurodata_type_def: FiberPhotometry
  neurodata_type_inc: LabMetaData
  doc: Extends LabMetaData to hold all Fiber Photometry metadata.
  groups:
  - neurodata_type_inc: FiberPhotometryTable
    doc: The table containing the metadata on the Fiber Photometry system.
  - neurodata_type_inc: FiberPhotometryIndicators
    doc: The group containing the Indicator objects.
  - neurodata_type_inc: FiberPhotometryViruses
    doc: The group containing the ViralVector objects.
    quantity: '?'
  - neurodata_type_inc: FiberPhotometryVirusInjections
    doc: The group containing the ViralVectorInjection objects.
    quantity: '?'
- neurodata_type_def: FiberPhotometryResponseSeries
  neurodata_type_inc: TimeSeries
  doc: Extends TimeSeries to hold Fiber Photometry data.
  datasets:
  - name: data
    dims:
    - - num_times
    - - num_times
      - num_fibers
    shape:
    - - null
    - - null
      - null
    doc: The data values. May be 1D or 2D. The first dimension must be time. The
      optional second dimension corresponds to the rows of FiberPhotometryTable
      referenced by fiber_photometry_table_region, in the same order.
  - name: fiber_photometry_table_region
    neurodata_type_inc: DynamicTableRegion
    doc: References the row(s) of FiberPhotometryTable that the data come from,
      one row per column of data.
    quantity: '?'
  - name: processing_parameters
    dtype: text
    doc: JSON-encoded parameters of the processing that produced the data, in
      the vocabulary of the software named by the processing_software attribute.
    quantity: '?'
    attributes:
    - name: processing_software
      dtype: text
      doc: Name of the software that produced the data.
    - name: processing_software_version
      dtype: text
      doc: Version of the software that produced the data.
  - name: processing_parameters_schema
    dtype: text
    doc: Self-contained JSON Schema that processing_parameters conforms to. The
      draft is named by the $schema key of the JSON Schema. Requires
      processing_parameters.
    quantity: '?'
- neurodata_type_def: CommandedVoltageSeries
  neurodata_type_inc: TimeSeries
  doc: Extends TimeSeries to hold a Commanded Voltage
  datasets:
  - name: data
    dtype: float
    dims:
    - num_times
    shape:
    - null
    doc: Voltages (length number timesteps) in unit volts.
  - name: frequency
    dtype: float
    doc: Voltage frequency in unit hertz.
    quantity: '?'
    attributes:
    - name: unit
      dtype: text
      value: hertz
      doc: frequency unit
